<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agencia Virtual - Municipalidad de Lima</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="overlay"></div>
    <div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
        <div class="content text-center">
            <!-- LOGO -->
            <img src="assets/logo.png" class="logo mb-4" alt="Logo MML">
            <h1 class="title mb-4">AGENCIA VIRTUAL</h1>
            <!-- CARD CENTRAL -->
            <div class="card home-card shadow">
                <div class="card-body p-4">
                    <p class="description">
                        Bienvenido a la <strong>Agencia Virtual de la Municipalidad Metropolitana de Lima</strong>
                        <br><br>
                        Realiza tus trámites de manera rápida y segura.
                    </p>
                    <a href="login.html" class="btn btn-primary btn-custom w-100 mb-3">Iniciar sesión</a>
                    <button class="btn btn-outline-primary btn-custom w-100" data-bs-toggle="modal" data-bs-target="#registroModal">Regístrate</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL REGISTRO -->
    <div class="modal fade" id="registroModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Registro de Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="registroForm">
                        <div class="mb-3">
                            <label>Tipo documento</label>
                            <select class="form-select" required>
                                <option value="">Seleccione</option>
                                <option>DNI</option>
                                <option>CE</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>N° Documento</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Correo electrónico</label>
                            <input type="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Contraseña</label>
                            <input type="password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Confirmar contraseña</label>
                            <input type="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Crear Cuenta</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
