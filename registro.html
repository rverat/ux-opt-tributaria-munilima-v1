<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Nuevo Registro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/auth.css">

</head>

<body>

<div class="overlay"></div>

<div class="container vh-100 d-flex justify-content-center align-items-center">

<div class="content text-center">

<img src="assets/logo.png" class="logo mb-4">

<h1 class="title mb-5">
AGENCIA VIRTUAL
</h1>

<div class="card auth-card shadow">

<div class="card-body p-4">

<h5 class="mb-4">
Para registrarte ingresa los siguientes datos:
</h5>

<form id="registroForm">

<div class="mb-3">

<label class="form-label">
Tipo documento(*)
</label>

<select class="form-select" id="tipoDoc">

<option>DNI</option>
<option>CE</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Número de documento(*)
</label>

<input
type="text"
class="form-control"
id="documento">

</div>

<div class="mb-3 position-relative">

<label class="form-label">
Contraseña(*)
</label>

<input
type="password"
class="form-control"
id="password">

<i class="bi bi-eye-fill eye-icon"
onclick="togglePassword('password')"></i>

</div>

<div class="mb-3 position-relative">

<label class="form-label">
Confirmar contraseña(*)
</label>

<input
type="password"
class="form-control"
id="confirmPassword">

<i class="bi bi-eye-fill eye-icon"
onclick="togglePassword('confirmPassword')"></i>

</div>

<button
type="submit"
class="btn btn-primary w-100 btn-main">

Regístrate

</button>

<p class="required mt-3">
(*) Datos obligatorios
</p>

<div class="d-flex justify-content-between mt-4">

<a href="recuperar.html"
class="btn btn-outline-primary btn-sm">

¿Has olvidado tu contraseña?

</a>

<a href="login.html"
class="btn btn-outline-primary btn-sm">

Atrás

</a>

</div>

</form>

</div>

</div>

</div>

</div>

<!-- MODAL -->

<div class="modal fade" id="successModal">

<div class="modal-dialog modal-dialog-centered">

<div class="modal-content">

<div class="modal-header">

<h5>Registro exitoso</h5>

<button class="btn-close" data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

Cuenta creada correctamente.

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/registro.js"></script>

</body>
</html>
