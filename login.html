<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login - Agencia Virtual</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="overlay"></div>

<div class="container vh-100 d-flex justify-content-center align-items-center">

<div class="content text-center">

<img src="assets/logo.png" class="logo mb-4">

<h1 class="title mb-4">
AGENCIA VIRTUAL
</h1>

<div class="card login-card shadow">

<div class="card-body p-4">

<h6 class="text-center mb-4">
Iniciar sesión
</h6>

<form id="loginForm">

<div class="mb-3">

<select id="tipoDoc" class="form-select">

<option value="">
Seleccione...
</option>

<option>DNI</option>
<option>CE</option>

</select>

</div>

<div class="mb-3">

<input
id="documento"
type="text"
class="form-control"
placeholder="N.° de documento">

</div>

<div class="mb-2 position-relative">

<input
id="password"
type="password"
class="form-control"
placeholder="Contraseña">

</div>

<div class="form-check mb-3 text-start">

<input
class="form-check-input"
type="checkbox"
id="mostrarPass">

<label class="form-check-label">

Mostrar contraseña

</label>

</div>

<button
type="submit"
class="btn btn-primary w-100 btn-login">

Ingresar

</button>

</form>

<div class="links text-start mt-4">

<a href="#" data-bs-toggle="modal" data-bs-target="#recuperarModal">

Olvidé mi contraseña

</a>

<br>

<a href="#">
Cambiar mi contraseña
</a>

<br><br>

<a href="#" class="registro-link"
data-bs-toggle="modal"
data-bs-target="#registroModal">

No tengo usuario (Registrar)

</a>

</div>

</div>

</div>

</div>

</div>

<!-- MODAL ERROR -->

<div class="modal fade" id="errorModal">

<div class="modal-dialog modal-dialog-centered">

<div class="modal-content">

<div class="modal-header">

<h5>Error de acceso</h5>

<button class="btn-close" data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

Credenciales incorrectas.

Revise la información ingresada.

</div>

</div>

</div>

</div>

<!-- MODAL ÉXITO -->

<div class="modal fade" id="successModal">

<div class="modal-dialog modal-dialog-centered">

<div class="modal-content">

<div class="modal-header">

<h5>Acceso autorizado</h5>

</div>

<div class="modal-body text-center">

<div class="spinner-border text-primary mb-3"></div>

<p>

Validando acceso...

</p>

</div>

</div>

</div>

</div>

<!-- RECUPERAR -->

<div class="modal fade" id="recuperarModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Recuperar contraseña</h5>

<button class="btn-close" data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<input
type="email"
class="form-control"
placeholder="Correo electrónico">

</div>

<div class="modal-footer">

<button class="btn btn-primary">

Enviar enlace

</button>

</div>

</div>

</div>

</div>

<!-- REGISTRO -->

<div class="modal fade" id="registroModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Registro Usuario</h5>

<button class="btn-close" data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<input class="form-control mb-3" placeholder="Correo">

<input class="form-control mb-3" placeholder="Documento">

<input class="form-control" placeholder="Contraseña">

</div>

<div class="modal-footer">

<button class="btn btn-primary">

Crear cuenta

</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/login.js"></script>

</body>
</html>
